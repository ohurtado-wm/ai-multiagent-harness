name: Deploy site to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'docs/site/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          site="$RUNNER_TEMP/pages-site"
          docs_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/dev"

          mkdir -p "$site"
          cp -a docs/site/. "$site/"

          sed -i \
            -e "s|href=\"\.\./\.\./|href=\"$docs_url/|g" \
            -e "s|href=\"\.\./guides/|href=\"$docs_url/docs/guides/|g" \
            "$site/index.html" "$site/presentation.html"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
